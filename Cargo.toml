[workspace]
resolver = "2"
members = [
    "xtask",
    "crates/steadq-format",
    "crates/steadq-names",
    "crates/steadq-math",
    "crates/steadq-fs-linux",
    "crates/steadq-core",
    "crates/steadq-cli",
    "crates/steadq-testkit",
    "crates/steadq-capi",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.97.1"
license = "Apache-2.0"
authors = ["David Torcivia <davidtorcivia@gmail.com>"]
repository = "https://github.com/davidtorcivia/SteadQ"

[workspace.dependencies]
sha2 = "0.10"
criterion = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
