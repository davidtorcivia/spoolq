# Mutation testing configuration.
# Exclude recovery/scan internals whose counters and skip paths are not
# asserted by unit tests, and whole-function replacements of multi-path
# guards that are covered by fault-injection tests as integration paths
# rather than by cargo-mutants line mutants.
exclude_re = [
    "move_to_dead",
    "receipt_is_authentic",
    "fsck_verify_name_tag",
    "verify_shard_placement",
    "delete_expired_receipts",
    "reap_expired_leases",
    "promote_delayed",
    "cleanup_temp_files",
    "compact_receipts",
    # Optimization guards backed by decode validation: behavioral outcome
    # is identical whether the guard uses == or !=, && or ||.
    "fsck_file",
    "check_duplicate_ack_bounded",
    # Recovery quarantine helper: tested via integration, not unit-assertable
    # on its own without corrupting leased files mid-flight.
    "quarantine_recovery_object",
    # Thin TLS fault-check branches and idle paths.
    "fault::check",
    "fault::reset",
    "fault::inject",
    "fault::inject_errno",
    "fault::inject_at",
    "fault::call_count",
]
